<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LD</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- Settings -->
    <link rel="stylesheet" href="styles/settings/wrapper.css">
    <link rel="stylesheet" href="styles/settings/core.css">
    <link rel="stylesheet" href="styles/settings/colors.css">
    <link rel="stylesheet" href="styles/settings/text.css">
    <link rel="stylesheet" href="styles/settings/input.css">

    <!-- Generic -->
    <link rel="stylesheet" href="styles/generic/reset.css">
    <link rel="stylesheet" href="styles/generic/box-sizing.css">

    <!-- Base -->
    <link rel="stylesheet" href="styles/base/html.css">

    <!-- Objects -->
    <link rel="stylesheet" href="styles/objects/ld-wrapper.css">

    <!-- Components -->
    <link rel="stylesheet" href="styles/components/ld-button.css">
    <link rel="stylesheet" href="styles/components/ld-input.css">
    <link rel="stylesheet" href="styles/components/ld-radio.css">
    <link rel="stylesheet" href="styles/components/ld-header.css">

    <!-- Pages -->
    <link rel="stylesheet" href="styles/pages/login.css">

    <!-- Trumps -->

    <script src="scripts/login.js"></script>
</head>

<body>
    <div class="ld-login">
        <div class="ld-wrapper">
            <header class="ld-header">
                <div class="wrapper">
                    <div class="image-wrapper">
                        <img class="image" src="assets/logo/devfreela.svg" alt="DevFreela Logo" />
                    </div>
                </div>
            </header>

            <main class="main-content">
                <form class="left" onsubmit="cadastrar()" action="javascript:void(0)">
                    <div class="select-role">
                        <h1 class="main-title">
                            <span class="up">Olá!</span>
                            <span class="down">Vamos criar o seu cadastro.</span>
                        </h1>
                        <h3 class="title">Qual o seu perfil?</h3>
                        <div class="radio-buttons">
                            <label class="ld-radio">
                                Dev
                                <input name="role" type="radio">
                                <span class="checkmark"></span>
                            </label>

                            <label class="ld-radio">
                                Cliente
                                <input name="role" type="radio">
                                <span class="checkmark"></span>
                            </label>
                        </div>
                    </div>

                    <input id="fullName" class="ld-input" type="text" placeholder="Nome completo" required>
                    <input id="birthDate" class="ld-input" type="date" placeholder="Data de nascimento" required>
                    <input id="email" class="ld-input" type="email" placeholder="Email" required>
                    <input id="password" class="ld-input" type="password" placeholder="Senha" required>

                    <button type="submit" class="ld-button">Continuar</button>
                </form>
                <div class="right">
                    <img class="image" src="assets/image/bg-cubes.png" alt="Decoration background with 3 cubes">
                </div>
            </main>
        </div>
    </div>

</body>

</html>
