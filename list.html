<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LD</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Settings -->
    <link rel="stylesheet" href="styles/settings/wrapper.css">
    <link rel="stylesheet" href="styles/settings/core.css">
    <link rel="stylesheet" href="styles/settings/colors.css">
    <link rel="stylesheet" href="styles/settings/text.css">
    <link rel="stylesheet" href="styles/settings/img.css">

    <!-- Generic -->
    <link rel="stylesheet" href="styles/generic/reset.css">
    <link rel="stylesheet" href="styles/generic/box-sizing.css">

    <!-- Base -->
    <link rel="stylesheet" href="styles/base/html.css">

    <!-- Objects -->
    <link rel="stylesheet" href="styles/objects/ld-wrapper.css">

    <!-- Components -->
    <link rel="stylesheet" href="styles/components/ld-button.css">
    <link rel="stylesheet" href="styles/components/ld-header.css">
    <link rel="stylesheet" href="styles/components/ld-table.css">

    <!-- Pages -->
    <link rel="stylesheet" href="styles/pages/list.css">

    <!-- Trumps -->
</head>

<body>
    <div id="loader">
        <div class="ld-spinner"></div>
    </div>
    <div class="ld-list">
        <div class="ld-wrapper">
            <header class="ld-header">
                <div class="wrapper -has-user">
                    <div></div>

                    <div class="logo-wrapper">
                        <img class="image" src="assets/logo/devfreela.svg" alt="DevFreela Logo" />
                    </div>

                    <div class="user">
                        <div class="info">
                            <span id="name" class="name"></span>
                            <span id="role" class="role"></span>
                        </div>
                        <div class="photo-wrapper">
                            <img src="https://img.freepik.com/free-photo/portrait-white-man-isolated_53876-40306.jpg?semt=ais_rp_progressive&w=740&q=80"
                                alt="Profile picture">
                        </div>
                    </div>
                </div>

            </header>

            <main class="main-content -one-col">
                <div class="title-button">
                    <h1 class="title">Projetos</h1>
                    <div class="button-wrapper">
                        <button id="new-project" class="ld-button -small" onclick="redirectToCreateProject()">Novo
                            Projeto</button>
                    </div>
                </div>
                <div class="table-wrapper">
                    <div class="ld-table">
                        <div class="head">
                            <div class="row">
                                <div>Título</div>
                                <div>Custo Total</div>
                                <div>Ações</div>
                            </div>
                        </div>

                        <div id="table-body" class="body">

                        </div>
                    </div>
            </main>
        </div>
    </div>

</body>
<script src="scripts/list.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</html>
