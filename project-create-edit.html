<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LD</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">


    <!-- Settings -->
    <link rel="stylesheet" href="styles/settings/wrapper.css">
    <link rel="stylesheet" href="styles/settings/core.css">
    <link rel="stylesheet" href="styles/settings/colors.css">
    <link rel="stylesheet" href="styles/settings/text.css">
    <link rel="stylesheet" href="styles/settings/input.css">

    <!-- Generic -->
    <link rel="stylesheet" href="styles/generic/reset.css">
    <link rel="stylesheet" href="styles/generic/box-sizing.css">

    <!-- Base -->
    <link rel="stylesheet" href="styles/base/html.css">

    <!-- Objects -->
    <link rel="stylesheet" href="styles/objects/ld-wrapper.css">

    <!-- Components -->
    <link rel="stylesheet" href="styles/components/ld-button.css">
    <link rel="stylesheet" href="styles/components/ld-input.css">
    <link rel="stylesheet" href="styles/components/ld-radio.css">
    <link rel="stylesheet" href="styles/components/ld-header.css">

    <!-- Pages -->
    <link rel="stylesheet" href="styles/pages/project-create-edit.css">

    <!-- Trumps -->

    <script src="scripts/project-create-edit.js"></script>
</head>

<body>
    <div class="ld-project-create-edit">
        <div class="ld-wrapper">
            <header class="ld-header">
                <div class="wrapper">
                    <div class="image-wrapper">
                        <img class="image" src="assets/logo/devfreela.svg" alt="DevFreela Logo" />
                    </div>
                </div>
            </header>

            <main class="main-content">
                    <a class="back-btn material-icons" href="list.html">
                        keyboard_arrow_left
                    </a>
                    <form class="left" method="post" onsubmit="cadastrar()" action="javascript:void(0)">

                        <h1 id="main-title" class="main-title">
                            Vamos cadastrar seu novo projeto!   
                        </h1>

                        <input id="title" class="ld-input" type="text" placeholder="Título" required>
                        <input id="total-cost" class="ld-input" type="text" placeholder="Custo Total" required>
                        <textarea id="description" placeholder="Descrição" class="ld-input" required></textarea>

                        <button id="action-button" class="ld-button">Cadastrar</button>
                    </form>
                    <div class="right">
                        <img class="image" src="assets/image/bg-float-cubes.png"
                            alt="Decoration background with float cubes">
                    </div>
            </main>
        </div>
    </div>

</body>

</html>
